name: CI

# Runs on every push and PR from EITHER device. Green = the plumbing still works;
# this is the shared pass/fail signal between you and the agent on your laptop.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run offline checks (no network / no API keys)
        run: pytest -q
